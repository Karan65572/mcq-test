
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Quiz App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0eaff, #f5e8ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.quiz-container {
    background: white;
    width: 100%;
    max-width: 600px;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    color: #4f46e5;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.top-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.info {
    background: #eef2ff;
    padding: 10px 13px;
    border-radius: 10px;
    font-weight: bold;
    color: #4338ca;
}

.timer {
    background: #fff0f0;
    color: #dc2626;
}

.progress-bg {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress {
    width: 5%;
    height: 100%;
    background: #4f46e5;
    transition: width 0.3s;
}

#question {
    font-size: 21px;
    line-height: 1.5;
    margin-bottom: 20px;
    color: #1f2937;
}

.option {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 2px solid #e5e7eb;
    background: white;
    border-radius: 12px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    overflow-wrap: anywhere;
}

.option:hover:not(:disabled) {
    border-color: #6366f1;
    background: #f5f3ff;
}

.option:disabled {
    cursor: default;
}

.option.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
}

.option.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #991b1b;
}

#feedback {
    min-height: 25px;
    margin: 12px 0;
    font-weight: bold;
}

.next-btn, .restart-btn {
    width: 100%;
    padding: 15px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.next-btn:hover, .restart-btn:hover {
    background: #3730a3;
}

.result {
    text-align: center;
}

.result h2 {
    color: #4f46e5;
    margin-bottom: 20px;
    font-size: 28px;
}

.score-circle {
    width: 150px;
    height: 150px;
    border: 8px solid #c7d2fe;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 20px auto;
    color: #4338ca;
}

.score-circle strong {
    font-size: 35px;
}

.result p {
    margin: 12px 0;
    font-size: 17px;
}

.hidden {
    display: none;
}

.review {
    text-align: left;
    margin-top: 25px;
}

.review-item {
    background: #f8fafc;
    border-radius: 10px;
    padding: 13px;
    margin: 10px 0;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

@media (max-width: 480px) {
    body {
        padding: 10px;
        align-items: flex-start;
    }

    .quiz-container {
        padding: 18px;
        margin-top: 10px;
        border-radius: 15px;
    }

    h1 {
        font-size: 24px;
    }

    #question {
        font-size: 19px;
    }

    .option {
        padding: 13px;
        font-size: 15px;
    }

    .info {
        padding: 9px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="quiz-container">

    <h1>MCQ Quiz</h1>
    <p class="subtitle">Test Your Knowledge!</p>

    <div id="quiz">
        <div class="top-info">
            <div class="info" id="questionCount">Question 1/20</div>
            <div class="info timer" id="timer">Time: 30s</div>
            <div class="info" id="score">Score: 0</div>
        </div>

        <div class="progress-bg">
            <div class="progress" id="progress"></div>
        </div>

        <h2 id="question">Question goes here</h2>

        <div id="options"></div>

        <p id="feedback" aria-live="polite"></p>

        <button class="next-btn" id="nextBtn" disabled>
            Next Question →
        </button>
    </div>

    <div id="result" class="result hidden" aria-live="polite">
        <h2>Quiz Completed!</h2>

        <div class="score-circle">
            <strong id="finalScore">0/20</strong>
            <span>Points</span>
        </div>

        <p id="percentage"></p>
        <p id="correctCount"></p>
        <p id="wrongCount"></p>
        <p id="resultMessage"></p>

        <button class="restart-btn" onclick="restartQuiz()">
            Restart Quiz ↻
        </button>

        <div class="review">
            <h3>Answer Review</h3>
            <div id="reviewList"></div>
        </div>
    </div>

</div>

<script>
const questions = [
    {
        q: "What does HTML stand for?",
        options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyperlinks Text Management Language",
            "Home Tool Markup Language"
        ],
        answer: 0
    },
    {
        q: "Which language is used to style web pages?",
        options: ["Python", "CSS", "SQL", "C"],
        answer: 1
    },
    {
        q: "Which language makes web pages interactive?",
        options: ["HTML", "CSS", "JavaScript", "XML"],
        answer: 2
    },
    {
        q: "Which HTML tag creates a hyperlink?",
        options: ["<link>", "<a>", "<href>", "<url>"],
        answer: 1
    },
    {
        q: "Which symbol is used for an ID selector in CSS?",
        options: [".", "#", "*", "&"],
        answer: 1
    },
    {
        q: "Which keyword declares a block-scoped variable in JavaScript?",
        options: ["varname", "int", "let", "define"],
        answer: 2
    },
    {
        q: "Which HTML tag displays an image?",
        options: ["<image>", "<picture-src>", "<img>", "<photo>"],
        answer: 2
    },
    {
        q: "Which CSS property changes text color?",
        options: ["font-style", "text-color", "color", "background"],
        answer: 2
    },
    {
        q: "What is the correct way to write a comment in JavaScript?",
        options: ["<!-- comment -->", "// comment", "** comment", "## comment"],
        answer: 1
    },
    {
        q: "Which HTML tag creates an unordered list?",
        options: ["<ol>", "<li>", "<ul>", "<list>"],
        answer: 2
    },
    {
        q: "Which operator checks strict equality in JavaScript?",
        options: ["=", "==", "===", "!="],
        answer: 2
    },
    {
        q: "Which CSS layout system is designed for one-dimensional layouts?",
        options: ["Flexbox", "Database", "SQL", "DOM"],
        answer: 0
    },
    {
        q: "Which method selects an element by its ID in JavaScript?",
        options: [
            "document.getElementById()",
            "document.getClass()",
            "document.getTag()",
            "document.selectId()"
        ],
        answer: 0
    },
    {
        q: "Which HTML attribute provides alternative text for an image?",
        options: ["title", "src", "alt", "href"],
        answer: 2
    },
    {
        q: "Which CSS property adds space inside an element's border?",
        options: ["margin", "padding", "outline", "gap"],
        answer: 1
    },
    {
        q: "Which array method adds an item to the end of an array?",
        options: ["push()", "pop()", "shift()", "slice()"],
        answer: 0
    },
    {
        q: "What does DOM stand for?",
        options: [
            "Data Object Method",
            "Document Object Model",
            "Digital Ordinance Model",
            "Document Orientation Mode"
        ],
        answer: 1
    },
    {
        q: "Which HTML element is used to create a form?",
        options: ["<input>", "<form>", "<label>", "<button>"],
        answer: 1
    },
    {
        q: "Which CSS unit is relative to the root element's font size?",
        options: ["px", "cm", "rem", "pt"],
        answer: 2
    },
    {
        q: "Which JavaScript function converts a JSON string into an object?",
        options: [
            "JSON.stringify()",
            "JSON.parse()",
            "JSON.convert()",
            "JSON.object()"
        ],
        answer: 1
    }
];

let currentQuestion = 0;
let score = 0;
let timeLeft = 30;
let timerInterval = null;
let selected = false;
let userAnswers = [];

const quiz = document.getElementById("quiz");
const result = document.getElementById("result");
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const timerEl = document.getElementById("timer");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 30;
    updateTimer();

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!selected) {
                userAnswers[currentQuestion] = null;
                selected = true;
                showCorrectAnswer();
                feedbackEl.textContent = "⏰ Time's up!";
                feedbackEl.style.color = "#dc2626";
                nextBtn.disabled = false;
                nextBtn.textContent =
                    currentQuestion === questions.length - 1
                    ? "View Result →"
                    : "Next Question →";
            }
        }
    }, 1000);
}

function updateTimer() {
    timerEl.textContent = `Time: ${timeLeft}s`;
    timerEl.style.color = timeLeft <= 10 ? "#dc2626" : "#dc2626";
}

function loadQuestion() {
    selected = false;
    nextBtn.disabled = true;
    nextBtn.textContent =
        currentQuestion === questions.length - 1
        ? "Finish Quiz ✓"
        : "Next Question →";

    feedbackEl.textContent = "";
    questionEl.textContent = questions[currentQuestion].q;

    document.getElementById("questionCount").textContent =
        `Question ${currentQuestion + 1}/${questions.length}`;

    document.getElementById("score").textContent = `Score: ${score}`;

    document.getElementById("progress").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    optionsEl.innerHTML = "";

    questions[currentQuestion].options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent =
            `${String.fromCharCode(65 + index)}. ${option}`;

        button.onclick = () => selectAnswer(index);
        optionsEl.appendChild(button);
    });

    startTimer();
}

function selectAnswer(index) {
    if (selected) return;

    selected = true;
    clearInterval(timerInterval);

    userAnswers[currentQuestion] = index;

    const correct = questions[currentQuestion].answer;
    const buttons = optionsEl.querySelectorAll(".option");

    buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === correct) {
            button.classList.add("correct");
        }

        if (i === index && index !== correct) {
            button.classList.add("wrong");
        }
    });

    if (index === correct) {
        score++;
        feedbackEl.textContent = "✓ Correct Answer!";
        feedbackEl.style.color = "#16a34a";
    } else {
        feedbackEl.textContent = "✗ Incorrect Answer!";
        feedbackEl.style.color = "#dc2626";
    }

    document.getElementById("score").textContent = `Score: ${score}`;
    nextBtn.disabled = false;
}

function showCorrectAnswer() {
    const correct = questions[currentQuestion].answer;
    const buttons = optionsEl.querySelectorAll(".option");

    buttons.forEach((button, i) => {
        button.disabled = true;
        if (i === correct) {
            button.classList.add("correct");
        }
    });
}

nextBtn.addEventListener("click", () => {
    if (!selected) return;

    clearInterval(timerInterval);

    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
    } else {
        showResult();
    }
});

function showResult() {
    clearInterval(timerInterval);
    quiz.classList.add("hidden");
    result.classList.remove("hidden");

    const total = questions.length;
    const incorrect = total - score;
    const percentage = Math.round((score / total) * 100);

    document.getElementById("finalScore").textContent =
        `${score}/${total}`;

    document.getElementById("percentage").textContent =
        `Percentage: ${percentage}%`;

    document.getElementById("correctCount").textContent =
        `Correct Answers: ${score}`;

    document.getElementById("wrongCount").textContent =
        `Incorrect or Unanswered: ${incorrect}`;

    document.getElementById("resultMessage").textContent =
        percentage >= 80 ? "Excellent work! 🎉" :
        percentage >= 50 ? "Good effort! Keep practising. 👍" :
        "Keep learning. You can do it! 💪";

    const reviewList = document.getElementById("reviewList");
    reviewList.innerHTML = "";

    questions.forEach((q, i) => {
        const item = document.createElement("div");
        item.className = "review-item";

        const title = document.createElement("strong");
        title.textContent = `${i + 1}. ${q.q}`;

        const yourAnswer = document.createElement("p");
        yourAnswer.textContent = "Your answer: " +
            (userAnswers[i] === null || userAnswers[i] === undefined
                ? "Not answered (time expired)"
                : q.options[userAnswers[i]]);

        const correctAnswer = document.createElement("p");
        correctAnswer.textContent =
            "Correct answer: " + q.options[q.answer];

        item.append(title, yourAnswer, correctAnswer);
        reviewList.appendChild(item);
    });
}

function restartQuiz() {
    clearInterval(timerInterval);
    currentQuestion = 0;
    score = 0;
    timeLeft = 30;
    selected = false;
    userAnswers = [];

    result.classList.add("hidden");
    quiz.classList.remove("hidden");

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
